spring.application.name=EmployeeManage
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.custom-css-url=/swagger-ui-theme.css

spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

app.seed.enabled=true
app.jwt.secret=${JWT_SECRET:EmployeeManageDevJwtSecretKey32BytesMin}
app.jwt.expiration-ms=86400000
app.upload.dir=${user.dir}/uploads/documents

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
